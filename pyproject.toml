[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-factor"
version = "0.1.0"
description = "Standalone paper_factor workflow extracted from RD-Agent."
requires-python = ">=3.10"
dependencies = [
  "dill",
  "filelock",
  "fuzzywuzzy",
  "jieba",
  "jqdatasdk",
  "litellm>=1.73",
  "loguru",
  "numpy",
  "openai",
  "pandas",
  "pyarrow",
  "pydantic-settings",
  "pyyaml",
  "psutil",
  "pymupdf",
  "python-dotenv",
  "python-Levenshtein",
  "requests",
  "rich",
  "scikit-learn",
  "tqdm",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rdagent*"]

[tool.setuptools.package-data]
rdagent = ["**/*.yaml", "**/*.md", "**/*.txt"]